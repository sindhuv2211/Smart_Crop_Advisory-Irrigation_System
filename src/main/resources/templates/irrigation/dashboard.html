<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Irrigation Status</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <h2>CropAnalysier</h2>
            <nav>
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/farmers}">Farmers</a>
                <a th:href="@{/crops}">Crops</a>
                <a th:href="@{/irrigation}">Irrigation Records</a>
                <a th:href="@{/irrigation/dashboard}" class="active">Irrigation Status</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-button">Logout</button>
                </form>
            </nav>
        </aside>

        <main class="content-area">
            <header class="page-header">
                <h1>Irrigation Status</h1>
            </header>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Crop</th>
                            <th>Soil Moisture</th>
                            <th>Water Qty</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${irrigations}">
                            <td th:text="${item.crop.cropName}"></td>
                            <td th:text="${item.soilMoisture} + '%' "></td>
                            <td th:text="${item.waterQuantity}"></td>
                            <td th:text="${item.status}"></td>
                            <td th:text="${#temporals.format(item.irrigationTime, 'yyyy-MM-dd HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
