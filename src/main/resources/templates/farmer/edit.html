<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Farmer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-card wide">
        <h1>Edit Farmer</h1>
        <form th:action="@{/farmers/edit/{id}(id=${farmer.id})}" th:object="${farmer}" method="post">
            <div class="grid-two">
                <div>
                    <label>Name</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required>
                </div>
                <div>
                    <label>Phone Number</label>
                    <input type="text" th:field="*{phoneNumber}" required>
                </div>
                <div>
                    <label>Farm Location</label>
                    <input type="text" th:field="*{farmLocation}" required>
                </div>
            </div>
            <label>Address</label>
            <textarea th:field="*{address}" rows="3" required></textarea>
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Leave blank to keep current password">
            <div class="action-links">
                <button type="submit">Update</button>
                <a th:href="@{/farmers}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
